  - name: python3-argon2-cffi
    buildsystem: simple
    build-commands:
    - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "argon2-cffi" --no-build-isolation
