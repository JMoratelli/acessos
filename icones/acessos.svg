<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tras2" x1="6" y1="8" x2="44" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#525d7c"/>
      <stop offset="1" stop-color="#2c3548"/>
    </linearGradient>
    <linearGradient id="frente2" x1="20" y1="24" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#465076"/>
      <stop offset="1" stop-color="#1c2436"/>
    </linearGradient>
    <clipPath id="clipFrente2">
      <rect x="20" y="24" width="38" height="32" rx="7"/>
    </clipPath>
    <clipPath id="clipTras2">
      <rect x="6" y="8" width="38" height="30" rx="7"/>
    </clipPath>
    <filter id="sombra2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="borrado"/>
      <feOffset in="borrado" dx="0" dy="2" result="deslocado"/>
      <feComponentTransfer in="deslocado" result="sombra">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="sombra"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- painel de trás: faceta clara no canto, como uma dobra pegando luz -->
  <g>
    <rect x="6" y="8" width="38" height="30" rx="7" fill="url(#tras2)"/>
    <polygon points="6,8 30,8 6,26" fill="#ffffff" opacity=".14" clip-path="url(#clipTras2)"/>
    <rect x="6" y="8" width="38" height="30" rx="7" fill="none" stroke="#c7cee0" stroke-width="2" opacity=".55"/>
    <path d="M10 16h16M10 22h9" stroke="#dfe3ee" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- painel da frente: duas facetas (clara e escura) + sombra elevando do de trás -->
  <g filter="url(#sombra2)">
    <rect x="20" y="24" width="38" height="32" rx="7" fill="url(#frente2)"/>
    <polygon points="20,24 46,24 20,44" fill="#ffffff" opacity=".16" clip-path="url(#clipFrente2)"/>
    <polygon points="58,56 36,56 58,38" fill="#000000" opacity=".2" clip-path="url(#clipFrente2)"/>
    <rect x="20" y="24" width="38" height="32" rx="7" fill="none" stroke="#b3a8ff" stroke-width="2.5"/>
    <path d="M29 40h13" stroke="#79f0c4" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M42 34l6 6-6 6" fill="none" stroke="#79f0c4" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
