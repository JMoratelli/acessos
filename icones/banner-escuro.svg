<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a212b"/>
      <stop offset="1" stop-color="#080b0f"/>
    </linearGradient>
    <radialGradient id="gloAzul" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(950 90) scale(340)">
      <stop offset="0" stop-color="#748ffc" stop-opacity=".16"/>
      <stop offset="1" stop-color="#748ffc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloVerde" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 250) scale(300)">
      <stop offset="0" stop-color="#38d9a9" stop-opacity=".1"/>
      <stop offset="1" stop-color="#38d9a9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tras" x1="6" y1="8" x2="44" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#525d7c"/>
      <stop offset="1" stop-color="#2c3548"/>
    </linearGradient>
    <linearGradient id="frenteHub" x1="20" y1="24" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#465076"/>
      <stop offset="1" stop-color="#1c2436"/>
    </linearGradient>
    <clipPath id="clipFrenteHub"><rect x="20" y="24" width="38" height="32" rx="7"/></clipPath>
    <clipPath id="clipTrasHub"><rect x="6" y="8" width="38" height="30" rx="7"/></clipPath>
    <radialGradient id="hubGlo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 160) scale(90)">
      <stop offset="0" stop-color="#a49bf7" stop-opacity=".35"/>
      <stop offset="0.7" stop-color="#a49bf7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#a49bf7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#fundo)"/>
  <rect width="1200" height="320" fill="url(#gloAzul)"/>
  <rect width="1200" height="320" fill="url(#gloVerde)"/>

  <text x="64" y="150" font-family="IBM Plex Sans, Fira Sans, sans-serif" font-size="52" font-weight="600" fill="#eef0f4">Acessos</text>
  <text x="64" y="188" font-family="IBM Plex Sans, Fira Sans, sans-serif" font-size="19" fill="#94a1ae">VNC, RDP, SSH e SFTP em abas, numa janela só</text>
  <text x="64" y="222" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="13" letter-spacing="2" fill="#68757f">RDP · SSH · VNC · SFTP</text>
  <rect x="64" y="238" width="46" height="3" rx="1.5" fill="#748ffc"/>

  <g stroke="#333b45" stroke-width="1.5" fill="none" opacity=".9">
    <line x1="820" y1="132" x2="905" y2="150"/>
    <line x1="1040" y1="132" x2="955" y2="150"/>
    <line x1="820" y1="188" x2="905" y2="170"/>
    <line x1="1040" y1="188" x2="955" y2="170"/>
  </g>
  <g fill="#4a5568">
    <circle cx="862" cy="141" r="2.5"/>
    <circle cx="998" cy="141" r="2.5"/>
    <circle cx="862" cy="179" r="2.5"/>
    <circle cx="998" cy="179" r="2.5"/>
  </g>

  <!-- badge RDP (roxo) -->
  <g transform="translate(788,68)">
    <rect width="64" height="64" rx="14" fill="#2b2447" stroke="#b197fc" stroke-width="2"/>
    <g transform="translate(32,31)" stroke="#b197fc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-11" y="-9" width="22" height="15" rx="2"/>
      <line x1="-6" y1="9.5" x2="6" y2="9.5"/>
      <line x1="0" y1="6" x2="0" y2="9.5"/>
    </g>
    <text x="32" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a1ae">RDP</text>
  </g>

  <!-- badge SSH (verde) -->
  <g transform="translate(1008,68)">
    <rect width="64" height="64" rx="14" fill="#1b3128" stroke="#38d9a9" stroke-width="2"/>
    <g transform="translate(32,32)" stroke="#38d9a9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-11" y="-10" width="22" height="20" rx="2.2"/>
      <path d="M-4 -4l4 4-4 4"/>
      <line x1="1" y1="0" x2="6" y2="0"/>
    </g>
    <text x="32" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a1ae">SSH</text>
  </g>

  <!-- badge VNC (azul) -->
  <g transform="translate(788,188)">
    <rect width="64" height="64" rx="14" fill="#232c47" stroke="#748ffc" stroke-width="2"/>
    <g transform="translate(32,31)" stroke="#748ffc" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-11" y="-9" width="22" height="15" rx="2"/>
      <line x1="-6" y1="9.5" x2="6" y2="9.5"/>
      <line x1="0" y1="6" x2="0" y2="9.5"/>
    </g>
    <text x="32" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a1ae">VNC</text>
  </g>

  <!-- badge SFTP (âmbar) -->
  <g transform="translate(1008,188)">
    <rect width="64" height="64" rx="14" fill="#332810" stroke="#e0b458" stroke-width="2"/>
    <g transform="translate(32,32)" stroke="#e0b458" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-9" y="-11" width="18" height="22" rx="2"/>
      <path d="M3,-11 v6 h6" fill="none"/>
      <line x1="-5" y1="0" x2="5" y2="0"/>
      <line x1="-5" y1="4" x2="5" y2="4"/>
      <line x1="-5" y1="8" x2="1" y2="8"/>
    </g>
    <text x="32" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#94a1ae">SFTP</text>
  </g>

  <!-- hub: ícone real do Acessos, sem moldura extra -->
  <rect x="810" y="40" width="240" height="240" fill="url(#hubGlo)"/>
  <g transform="translate(893,123.5) scale(1.15)">
    <rect x="6" y="8" width="38" height="30" rx="7" fill="url(#tras)"/>
    <polygon points="6,8 30,8 6,26" fill="#ffffff" opacity=".14" clip-path="url(#clipTrasHub)"/>
    <rect x="6" y="8" width="38" height="30" rx="7" fill="none" stroke="#c7cee0" stroke-width="1.6" opacity=".92"/>
    <path d="M10 16h16M10 22h9" stroke="#dfe3ee" stroke-width="2.6" stroke-linecap="round" opacity=".85"/>

    <rect x="20" y="24" width="38" height="32" rx="7" fill="url(#frenteHub)"/>
    <polygon points="20,24 46,24 20,44" fill="#ffffff" opacity=".16" clip-path="url(#clipFrenteHub)"/>
    <polygon points="58,56 36,56 58,38" fill="#000000" opacity=".2" clip-path="url(#clipFrenteHub)"/>
    <rect x="20" y="24" width="38" height="32" rx="7" fill="none" stroke="#a49bf7" stroke-width="2.2"/>
    <path d="M29 40h13" stroke="#79f0c4" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M42 34l6 6-6 6" fill="none" stroke="#79f0c4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
