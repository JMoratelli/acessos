# Manifesto Flatpak do Acessos (porte Go).
#
# MESMO app-id do app em Python: esta versão SUBSTITUI a anterior. Os dois
# leem e escrevem os mesmos arquivos (~/.config/acessos), então instalar
# por cima não pede migração nenhuma — e é assim que quem tem a 1.2.2
# recebe a 2.0 pelo atualizador, que compara versões dentro do mesmo id.
#
# Runtime freedesktop, não o do GNOME: o Gio desenha direto em Vulkan/EGL
# sobre Wayland e não usa GTK para nada. O runtime freedesktop já traz
# libwayland, libxkbcommon, Vulkan loader e EGL/Mesa — que é exatamente a
# lista do que o binário precisa fora do que ele mesmo embute.
#
# As duas bibliotecas pesadas (libvncserver e FreeRDP3) NÃO existem no
# runtime e são compiladas aqui, com as mesmas opções já validadas no
# manifesto do app Python.
#
# Runtime 25.08 (e não 24.08) por causa do Go: as bibliotecas
# golang.org/x/* atuais exigem Go 1.26, e a extensão golang do 24.08 traz
# 1.25. Rebaixar as libs para caber no runtime velho seria abrir mão de
# correções de segurança do x/crypto — o caminho certo é o runtime novo.

app-id: org.jj.Acessos
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: acessos

build-options:
  # a extensão do Go não entra no PATH sozinha
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: -mod=vendor
    # nunca baixar toolchain: o build é offline e a versão do SDK serve
    GOTOOLCHAIN: local
    # sem cache gravável fora do build, o Go tenta escrever em $HOME
    GOCACHE: /run/build/acessos-go/.gocache
    GOMODCACHE: /run/build/acessos-go/.gomodcache

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # X11 de reserva: o Gio cai nele quando não há Wayland. O grab de
  # atalhos (internal/grab) só existe em Wayland e degrada sozinho.
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  # o FreeRDP guarda os certificados aceitos aqui
  - --filesystem=xdg-config/freerdp
  # known_hosts do SSH: é o mesmo arquivo do comando ssh, de propósito
  - --filesystem=~/.ssh
  # atualizador: baixa o bundle do release e chama o flatpak do host
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:

  # ---------------------------------------------------------- VNC
  - name: libvncserver
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_EXAMPLES=OFF
      - -DWITH_TESTS=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_GTK=OFF
    sources:
      - type: archive
        url: https://github.com/LibVNC/libvncserver/archive/refs/tags/LibVNCServer-0.9.15.tar.gz
        sha256: 62352c7795e231dfce044beb96156065a05a05c974e5de9e023d688d8ff675d7

  # ---------------------------------------------------------- RDP
  # WITH_X11=OFF: este porte é Wayland (o X11 do Gio é só reserva de
  # desenho; o cliente RDP nunca abre janela própria, ele entrega
  # framebuffer para nós).
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DCHANNEL_URBDRC=OFF
      # Kerberos NÃO existe no runtime freedesktop (o manifesto do app
      # Python só escapa disso por usar o runtime do GNOME, que traz
      # krb5). Sem ele o FreeRDP autentica por NTLM, que é o que acontece
      # HOJE na prática: contra o servidor de domínio daqui o Kerberos
      # falha ("Cannot find KDC for realm") e a sessão sobe por NTLM
      # mesmo. Compilar krb5 só para ver essa mesma falha mais bonita não
      # se paga; se um dia for preciso, entra como módulo antes deste.
      - -DWITH_KRB5=OFF
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/archive/refs/tags/3.31.1.tar.gz
        sha256: 254de9fe176758e9787347469fb310523782f03c61130508b51b266e374eb6c1

  # ---------------------------------------------------------- app
  - name: acessos-go
    buildsystem: simple
    # Sem --share=network: o repositório traz vendor/ com TODAS as
    # dependências (o Gio vendorizado inclusive), então o build é offline —
    # que é o exigido pelo Flathub e o que garante build reprodutível.
    build-commands:
      - go build -v -o acessos ./cmd/acessos
      - install -Dm755 acessos /app/bin/acessos
      - install -Dm644 flatpak/org.jj.Acessos.desktop
        /app/share/applications/org.jj.Acessos.desktop
      - install -Dm644 flatpak/org.jj.Acessos.metainfo.xml
        /app/share/metainfo/org.jj.Acessos.metainfo.xml
      - install -Dm644 icones/acessos.svg
        /app/share/icons/hicolor/scalable/apps/org.jj.Acessos.svg
    sources:
      - type: dir
        path: ..
