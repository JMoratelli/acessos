# org.jj.Acessos.yml — manifest para SUBMISSAO AO FLATHUB.
#
# Diferenca para o manifest que build.sh gera em build/manifest/: aquele usa
# caminhos locais (../../python, ../../src etc.) porque roda dentro do
# checkout de trabalho. Este busca o codigo-fonte por git (tag fixa), como
# a Flathub exige: o repositorio de build deles nao tem o resto do projeto
# ao lado, so este arquivo.
#
# Como submeter:
#   1. Fork de https://github.com/flathub/flathub
#   2. Criar uma branch chamada "org.jj.Acessos"
#   3. Copiar este arquivo para a raiz do fork, renomeado para
#      org.jj.Acessos.yml (sem o prefixo do caminho)
#   4. Abrir PR de org.jj.Acessos contra flathub/flathub — isso cria
#      automaticamente o repositorio github.com/flathub/org.jj.Acessos
#      onde o build de CI roda
#
# Para atualizar uma versao nova: mude "tag:" e "commit:" abaixo (uma nova
# tag no repo principal) e repita os testes locais com build.sh antes de
# atualizar o repositorio do Flathub.

app-id: org.jj.Acessos
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: acessos.py

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-config/freerdp
  - --talk-name=org.freedesktop.secrets
  # flatpak-spawn --host, usado por atualizador.py para baixar o .flatpak
  # do release e rodar 'flatpak install --reinstall' com ele no host, e
  # depois reabrir o app. Fora do Flathub: essa permissao normalmente nao
  # passa na revisao la (auto-atualizacao quebra o modelo de sandbox), mas
  # aqui o app e distribuido por fora.
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/gtk-doc
  - '*.a'
  - '*.la'

modules:

  - name: libvncserver
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_EXAMPLES=OFF
      - -DWITH_TESTS=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_GTK=OFF
    sources:
      - type: archive
        url: https://github.com/LibVNC/libvncserver/archive/refs/tags/LibVNCServer-0.9.15.tar.gz
        sha256: 62352c7795e231dfce044beb96156065a05a05c974e5de9e023d688d8ff675d7

  - name: vncshim
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -O2 -Wall -o libvncshim.so src/vncshim.c
        $(pkg-config --cflags --libs libvncclient)
      - install -Dm755 libvncshim.so /app/lib/acessos/libvncshim.so
    sources:
      - type: git
        url: https://github.com/JMoratelli/acessos.git
        tag: v1.1.0
        commit: bf5b35d098f3a571e120f9fe0e317de5926d9d61

  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_SERVER=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_X11=ON
      - -DWITH_WAYLAND=ON
      - -DCHANNEL_URBDRC=OFF
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/archive/refs/tags/3.31.1.tar.gz
        sha256: 254de9fe176758e9787347469fb310523782f03c61130508b51b266e374eb6c1

  - name: rdpshim
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -O2 -Wall -pthread -o librdpshim.so src/rdpshim.c
        $(pkg-config --cflags --libs freerdp3 freerdp-client3 winpr3)
      - install -Dm755 librdpshim.so /app/lib/acessos/librdpshim.so
    sources:
      - type: git
        url: https://github.com/JMoratelli/acessos.git
        tag: v1.1.0
        commit: bf5b35d098f3a571e120f9fe0e317de5926d9d61

  - name: vte
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dgtk3=true
      - -Dgtk4=false
      - -Dgir=true
      - -Dvapi=false
      - -Ddocs=false
      - -Da11y=true
      - -Dgnutls=true
    sources:
      - type: archive
        url: https://github.com/GNOME/vte/archive/refs/tags/0.76.4.tar.gz
        sha256: 88979af0b02bac3c6d0bc95fcbeaf0ee025a7fc7a5b127155188b90718af0e78

  - name: openssh
    config-opts:
      - --without-pam
      - --without-selinux
      - --without-kerberos5
      - --disable-strip
    make-install-args:
      - install-nokeys
    post-install:
      - rm -f /app/sbin/sshd /app/bin/ssh-keysign /app/bin/ssh-pkcs11-helper
    sources:
      - type: archive
        url: https://github.com/openssh/openssh-portable/archive/refs/tags/V_9_9_P2.tar.gz
        sha256: 082dffcf651b9db762ddbe56ca25cc75a0355a7bea41960b47f3c139974c5e3e

  - name: sshpass
    buildsystem: simple
    build-commands:
      - |
        cat > config.h <<'EOF'
        #define PACKAGE_NAME "sshpass"
        #define PACKAGE_STRING "sshpass 1.06"
        #define VERSION "1.06"
        #define PASSWORD_PROMPT "assword"
        EOF
      - gcc -O2 -Wall -DHAVE_CONFIG_H -D_GNU_SOURCE -I. -o sshpass main.c
      - install -Dm755 sshpass /app/bin/sshpass
    sources:
      - type: git
        url: https://github.com/kevinburke/sshpass
        commit: ca7baa670d799b85ff91b4056e0a2bf9772cb2cf

